<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mergenthaler-Vashio Thanksgiving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF3E4; --paper:#FFF9EF; --red:#B3261E; --red-dk:#8C1C16; --basil:#2E6B3A; --basil-dk:#1F4D29;
  --pumpkin:#D9772B; --gold:#E2B44B; --ink:#2B1B12; --muted:#7A6555; --line:#E8D9C0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--cream);
  min-height:100vh;display:flex;flex-direction:column;
}
.gingham{height:34px;flex:none;
  background:
   linear-gradient(90deg, rgba(179,38,30,.55) 50%, transparent 0) 0 0/34px 34px,
   linear-gradient(rgba(179,38,30,.55) 50%, transparent 0) 0 0/34px 34px, #FBF3E4;}
.gingham.bottom{margin-top:auto}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{
  width:min(1100px,100%);background:var(--paper);border-radius:18px;padding:clamp(20px,4vw,48px);
  box-shadow:0 0 0 6px var(--paper),0 0 0 8px var(--red),0 18px 40px rgba(60,30,10,.18);position:relative;
}
.phone .card{width:min(520px,100%)}
h1,.script{font-family:Lobster,cursive;font-weight:400}
h1{color:var(--red);font-size:clamp(34px,6vw,72px);line-height:1.05;margin:0 0 6px;text-align:center}
.sub{text-align:center;font-family:"DM Serif Display",serif;font-style:italic;color:var(--basil);font-size:clamp(18px,2.4vw,28px);margin:0 0 22px}
.tag{display:inline-block;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--basil);border:2px solid var(--basil);border-radius:999px;padding:4px 12px}
.center{text-align:center}
.big{font-family:"DM Serif Display",serif;font-size:clamp(28px,4.6vw,60px);line-height:1.15;margin:18px 0;text-align:center}
.mid{font-family:"DM Serif Display",serif;font-size:clamp(22px,3vw,36px);line-height:1.2;margin:12px 0;text-align:center}
.note{color:var(--muted);text-align:center;font-size:clamp(15px,1.6vw,20px);margin:8px 0}
.divider{text-align:center;color:var(--red);letter-spacing:.5em;margin:10px 0;font-size:18px}
.btn{font:800 18px Nunito,sans-serif;border:0;border-radius:14px;padding:16px 26px;cursor:pointer;color:#fff;background:var(--red);
  box-shadow:0 4px 0 var(--red-dk);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-dk)}
.btn.green{background:var(--basil);box-shadow:0 4px 0 var(--basil-dk)}
.btn.ghost{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.btn.small{font-size:15px;padding:10px 16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{display:block;width:100%;margin:10px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.menu{display:grid;gap:14px;max-width:460px;margin:10px auto 0}
.menu .btn{font-size:20px;padding:20px}
input[type=text],textarea{width:100%;font:600 20px Nunito,sans-serif;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--basil)}
textarea{min-height:90px;resize:vertical}
.masked{-webkit-text-security:disc}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:clamp(15px,1.7vw,20px)}
.chip.done{border-color:var(--basil);background:#E6F0E3;color:var(--basil-dk)}
.chip.on{background:var(--gold);border-color:var(--pumpkin)}
.chip button{all:unset;cursor:pointer;margin-left:8px;color:var(--red)}
.chip.tap{cursor:pointer;user-select:none}
.code{font-family:"DM Serif Display",serif;font-size:clamp(56px,10vw,120px);letter-spacing:.12em;color:var(--red);text-align:center;line-height:1}
.opts{display:grid;gap:12px;margin:14px 0}
.opt{text-align:left;font:700 18px Nunito,sans-serif;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--basil);background:#E6F0E3}
.tvopts{display:grid;gap:14px;margin:18px auto;max-width:900px}
.tvopt{font-family:"DM Serif Display",serif;font-size:clamp(20px,2.6vw,32px);background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center;cursor:default}
.tvopt.click{cursor:pointer}
.tvopt.win{border-color:var(--basil);background:#E6F0E3}
.tvopt .n{font-family:Nunito;font-weight:800;color:var(--basil);white-space:nowrap}
.bars{max-width:860px;margin:18px auto;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,200px) 1fr 44px;gap:12px;align-items:center;font-weight:800;font-size:clamp(16px,2vw,24px)}
.bar .t{height:30px;border-radius:8px;background:repeating-linear-gradient(45deg,var(--red),var(--red) 10px,#C8443A 10px,#C8443A 20px)}
.score{max-width:640px;margin:10px auto;display:grid;gap:8px}
.score div{display:flex;justify-content:space-between;font-size:clamp(18px,2.4vw,28px);font-weight:800;background:#fff;border-radius:12px;padding:10px 18px;border:2px solid var(--line)}
.score div:first-child{border-color:var(--gold);background:#FFF4D6}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px;flex-wrap:wrap}
.pill{font-weight:800;color:var(--muted);font-size:14px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
.step{display:flex;align-items:center;gap:8px}
.step button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;background:var(--cream);text-align:center;font-weight:800;line-height:32px;color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:14px 0}
.toggle{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;border:0}
.toggle.on{background:var(--red)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:25px}
.preds{max-width:860px;margin:10px auto;display:grid;gap:8px}
.preds div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-size:17px}
.preds b{color:var(--red)}
.stamp{position:absolute;top:-18px;right:24px;background:var(--basil);color:#fff;font-family:Lobster;font-size:20px;padding:6px 16px;border-radius:10px;transform:rotate(4deg);box-shadow:0 3px 0 var(--basil-dk)}
.err{color:var(--red);font-weight:800;text-align:center;margin:8px 0}
.hidden{display:none!important}
.emoji{font-size:clamp(40px,6vw,72px);text-align:center;margin:4px 0}
</style>
</head>
<body>
<div class="gingham"></div>
<div class="wrap"><div class="card" id="app"></div></div>
<div class="gingham bottom"></div>

<script>
/* ---------------- CONTENT ---------------- */
const C = {
  who: [
    ["Worst job you have ever had"],
    ["A smell that instantly takes you back to childhood"],
    ["The most famous person you've ever met or seen"],
    ["A skill you have that nobody here knows about"],
    ["Something that made you laugh this week"],
    ["A hobby you want to get into this year"],
    ["Something you are grateful for in 2026"],
    ["The first concert you ever went to"],
    ["Your first car, or the car you most wanted"],
    ["A food you refused to eat as a child but love now"],
    ["The worst haircut you've ever had"],
    ["Something you believed as a kid that turned out to be completely wrong"],
    ["The best gift you've ever received"],
    ["A movie you can watch over and over"],
    ["A rule you broke as a teenager", 1],
    ["The worst date you've ever been on", 1],
    ["A place you'd go tomorrow if someone else paid"],
    ["Something you're secretly competitive about"],
    ["A song that's guaranteed to get you dancing"],
    ["The weirdest thing you've ever eaten"],
    ["Your most useless talent"]
  ],
  hot: [
    ["What's the story behind your name?"],
    ["How did you end up living where you live?"],
    ["What's the first job you were proud of?"],
    ["What's the bravest thing you've ever done?"],
    ["What's a decision you made that changed everything?"],
    ["What did you think your life would look like at 30? How close did you get?"],
    ["What's a risk you're glad you took?"],
    ["When did you first feel like an adult?"],
    ["What's a piece of advice you got that turned out to be right?"],
    ["What do you know now that you wish you'd known at 25?"],
    ["What's something you changed your mind about?"],
    ["What would you tell your teenage self?"],
    ["What's the most trouble you ever got into on a trip?", 1],
    ["What's the best trip you've ever taken?"],
    ["What's a talent or hobby you had that you gave up?"],
    ["What's the most spontaneous thing you've ever done?"],
    ["Who was your childhood hero?"],
    ["What's your favorite Thanksgiving memory?"],
    ["What's a family tradition you want to keep going?"],
    ["What's something about someone at this table that you admire but have never told them?"]
  ],
  ml: [
    "Learn to cook a new signature dish",
    "Run (or walk) their first race",
    "Make a new close friend",
    "Get a promotion or start an exciting new job",
    "Read the most books",
    "Adopt a pet",
    "Finally finish a project they've been talking about for years",
    "Try something completely out of character, like skydiving or improv",
    "Reconnect with an old friend",
    "Be the one who plans the best family outing",
    "Be the first to visit someone else here",
    "Be the happiest surprise of the year",
    "Bring the best dish next year",
    "Have the best story to tell next Thanksgiving",
    "Pick up the most random new skill"
  ],
  open: [
    "What's one thing someone at this table will celebrate next year?",
    "What will be the best new restaurant we discover together?",
    "What new tradition will we start?",
    "What will we all be laughing about next Thanksgiving?",
    "What song or show will everyone be obsessed with?",
    "What's one goal you're betting the person to your left will hit?",
    "How many babies, weddings, or engagements will this group celebrate?",
    "What will be the most-used phrase in the family group chat?",
    "Where's the best place one of us will travel?"
  ]
};
const CHEERS = ["Mamma mia!","Bellissimo!","Ay, che bello!","Perfetto!","Mangia!","Salute!"];

/* ---------------- UTIL ---------------- */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0, Math.max(0,n));
const cheer = () => CHEERS[Math.floor(Math.random()*CHEERS.length)];
const store = { get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const ROUNDS = {1:["Round One","Chi l'ha detto?","Who Said It?"],2:["Round Two","La Sedia Calda","The Hot Seat"],3:["Round Three","Il Futuro","Predictions"]};

/* Phone play runs over PeerJS: phones connect straight to the TV's browser. No accounts, no server of ours. */
const roomReady = true;
const phonesAvailable = () => typeof window.Peer === 'function';
const PEER_OPTS = { debug: 0 };
function openPeer(id){
  return new Promise((res, rej) => {
    const p = id ? new Peer(id, PEER_OPTS) : new Peer(PEER_OPTS);
    const t = setTimeout(() => { rej(new Error('timeout')); try{p.destroy()}catch(e){} }, 12000);
    p.on('open', () => { clearTimeout(t); res(p); });
    p.on('error', e => { clearTimeout(t); rej(e); });
  });
}

let view = 'home';

/* ---------------- HOME ---------------- */
function renderHome(){
  view = 'home';
  document.body.classList.remove('phone');
  const phonesOK = phonesAvailable();
  app.innerHTML = `
    <div class="stamp">Est. 2026</div>
    <div class="emoji">🦃🍝🥧</div>
    <h1>Mergenthaler-Vashio<br>Thanksgiving</h1>
    <p class="sub">Three rounds. One table. Plenty of gravy.</p>
    <div class="divider">✦ ✦ ✦</div>
    <div class="menu">
      <button class="btn" id="hHost" ${phonesOK?'':'disabled'}>📺 Host on the TV (everyone uses phones)</button>
      <button class="btn green" id="hJoin" ${phonesOK?'':'disabled'}>📱 Join on my phone</button>
      <button class="btn ghost" id="hPass">🍷 One device: pass-the-phone mode</button>
    </div>
    <p class="note">${phonesOK ? 'Phones open this same link and tap “Join.” Best when everyone is on the house Wi-Fi.' : 'Phone play could not load. Check the internet connection, or use pass-the-phone mode.'}</p>`;
  const h = document.getElementById('hHost'), j = document.getElementById('hJoin');
  h && (h.onclick = () => hostStart('room'));
  j && (j.onclick = () => renderJoin());
  document.getElementById('hPass').onclick = () => hostStart('pass');
}

/* ---------------- HOST ---------------- */
let G, R = null, peersNow = [], HOST = null, conns = new Map(), lastS = null;
function newGame(mode){
  return { mode, code:'', players:[], spicy:false, cfg:{r1:5,r2:5,r3ml:5,r3open:3},
           rd:0, ph:'lobby', k:'k0', kc:0, cur:{}, r1:null, r2:null, r3:null, preds:[] };
}
async function hostStart(mode){
  view = 'host';
  G = newGame(mode);
  if (mode === 'room'){
    G.code = Array.from({length:4},()=> 'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random()*23)]).join('');
    app.innerHTML = '<p class="mid">Setting the table…</p>';
    let ok = false;
    for (let tries = 0; tries < 3 && !ok; tries++){
      try {
        HOST = await openPeer('mvtg-' + G.code.toLowerCase());
        ok = true;
      } catch(e){
        G.code = Array.from({length:4},()=> 'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random()*23)]).join('');
      }
    }
    if (!ok){
      G.mode = 'pass'; HOST = null;
      alertBox = 'Phones could not connect, so we switched to pass-the-phone mode.';
    } else {
      R = true;
      HOST.on('connection', conn => {
        conns.set(conn, {});
        conn.on('open', () => { if (lastS) conn.send({ t:'s', s:lastS }); });
        conn.on('data', d => {
          if (!d || d.t !== 'pres' || typeof d.p !== 'object') return;
          const st = conns.get(conn) || {};
          Object.assign(st, d.p); conns.set(conn, st); rebuildPeers();
        });
        const gone = () => { conns.delete(conn); rebuildPeers(); };
        conn.on('close', gone); conn.on('error', gone);
      });
      HOST.on('disconnected', () => { try { HOST.reconnect(); } catch(e){} });
    }
  }
  renderHost(); publish();
}
let alertBox = '';
function rebuildPeers(){
  const byPid = new Map();
  for (const st of conns.values()){ if (st.pid && st.role === 'p') byPid.set(String(st.pid), st); }
  peersNow = [...byPid.entries()].map(([pid, st]) => ({ peer:pid, isMe:false, presence:{ role:'p', name:st.name, r:st.r } }));
  syncPlayers(); renderHost();
}
function syncPlayers(){
  if (G.mode !== 'room') return;
  for (const p of peersNow){
    const pr = p.presence || {};
    if (p.isMe || pr.role !== 'p' || !pr.name) continue;
    const name = String(pr.name).slice(0,20);
    let ex = G.players.find(x => x.id === p.peer);
    if (!ex){ // someone reloaded their phone: reclaim their seat (and score) by name
      const on = online();
      ex = G.players.find(x => x.name.toLowerCase() === name.toLowerCase() && !on.has(x.id));
      if (ex) ex.id = p.peer;
    }
    if (ex) ex.name = name; else G.players.push({ id:p.peer, name, score:0 });
  }
}
function online(){ return new Set(peersNow.filter(p => (p.presence||{}).role==='p').map(p => p.peer)); }
function resp(){
  const m = {};
  for (const p of peersNow){ const pr = p.presence||{}; if (pr.role==='p' && pr.r && pr.r.k === G.k) m[p.peer] = pr.r.v; }
  return m;
}
const pname = id => (G.players.find(p => p.id === id) || {}).name || 'Someone';
const addPts = (id, n) => { const p = G.players.find(x => x.id === id); if (p) p.score += n; };

function go(rd, ph, extra){ G.rd = rd; G.ph = ph; Object.assign(G.cur, extra || {}); G.k = 'k' + (++G.kc); renderHost(); publish(); }

function publish(){
  if (!R || G.mode !== 'room') return;
  const s = { k:G.k, rd:G.rd, ph:G.ph, pl:G.players.map(p => [p.id, p.name]) };
  const c = G.cur;
  if (G.rd===1 && (G.ph==='ans')) s.q = c.prompt[0];
  if (G.rd===1 && (G.ph==='guess' || G.ph==='reveal')) { s.q = c.prompt[0]; s.a = c.answers[c.ai].text; }
  if (G.rd===1 && G.ph==='reveal') s.au = c.answers[c.ai].by;
  if (G.rd===2 && G.ph!=='intro' && G.ph!=='scores') s.seat = c.seat;
  if (G.rd===2 && G.ph==='vote') s.o = c.opts.map(o => o.text);
  if (G.rd===2 && G.ph==='tell') s.q = c.q;
  if (G.rd===3 && (G.ph==='vote' || G.ph==='reveal')) s.it = c.item;
  s.sp = G.spicy ? 1 : 0;
  lastS = s;
  for (const conn of conns.keys()){ try { if (conn.open) conn.send({ t:'s', s }); } catch(e){} }
}

/* ---- flow ---- */
function startGame(){
  const pool = C.who.filter(x => G.spicy || !x[1]);
  G.players.forEach(p => p.score = 0);
  G.preds = [];
  G.r1 = { prompts: pick(pool, G.cfg.r1), pi:0 };
  go(1,'intro');
}
function r1Ask(){ go(1,'ans',{ prompt:G.r1.prompts[G.r1.pi], passI:0, passOpen:false, passAns:{} }); }
function r1NextPrompt(){ G.r1.pi++; if (G.r1.pi < G.r1.prompts.length) r1Ask(); else go(1,'scores'); }
function r2Setup(){
  const ids = G.mode==='room' ? G.players.filter(p => online().has(p.id)).map(p=>p.id) : G.players.map(p=>p.id);
  G.r2 = { seats: pick(ids.length ? ids : G.players.map(p=>p.id), G.cfg.r2), si:0 };
  go(2,'intro');
}
function bankPool(){ return C.hot.filter(x => G.spicy || !x[1]).map(x => x[0]); }
function seatStart(si){
  G.r2.si = si; const seat = G.r2.seats[si];
  if (G.mode==='room') go(2,'ask',{ seat, opts:[], q:'' });
  else go(2,'pick',{ seat, opts: pick(bankPool(),3).map(t=>({text:t})), q:'' });
}
function r3Setup(){
  const items = pick(C.ml, G.cfg.r3ml).map(t => ({t, type:'ml'})).concat(pick(C.open, G.cfg.r3open).map(t => ({t, type:'open'})));
  G.r3 = { items, ii:0 };
  go(3,'intro');
}
function itemStart(ii){ G.r3.ii = ii; go(3,'vote',{ item:G.r3.items[ii], tally:{}, notes:'', result:null }); }

function next(){
  const c = G.cur, key = G.rd + ':' + G.ph;
  switch(key){
    case '1:intro': return r1Ask();
    case '1:ans': {
      const src = G.mode==='room' ? resp() : c.passAns;
      const answers = shuffle(Object.entries(src).filter(([id,t]) => typeof t==='string' && t.trim()).map(([by,text]) => ({by, text:text.trim().slice(0,140)})));
      if (!answers.length) return r1NextPrompt();
      return go(1,'guess',{ answers, ai:0, votes:{}, awarded:[] });
    }
    case '1:guess': {
      const a = c.answers[c.ai];
      if (G.mode==='room'){
        const votes = resp(); let right = [], fooled = 0;
        for (const [voter, v] of Object.entries(votes)){ if (voter === a.by) continue; if (v === a.by){ right.push(voter); addPts(voter,100); } else fooled++; }
        addPts(a.by, 50*fooled);
        return go(1,'reveal',{ votes, right, fooled });
      }
      return go(1,'reveal',{ awarded:[] });
    }
    case '1:reveal': {
      if (c.ai + 1 < c.answers.length){ c.ai++; return go(1,'guess',{ votes:{}, awarded:[] }); }
      return r1NextPrompt();
    }
    case '1:scores': return r2Setup();
    case '2:intro': return seatStart(0);
    case '2:ask': {
      const seen = new Map();
      for (const [id, v] of Object.entries(resp())){
        if (id === c.seat || typeof v !== 'string' || !v.trim()) continue;
        const t = v.trim().slice(0,160); const key = t.toLowerCase();
        if (!seen.has(key)) seen.set(key, { text:t, by:[id] }); else seen.get(key).by.push(id);
      }
      let opts = [...seen.values()];
      if (!opts.length) opts = pick(bankPool(),3).map(t => ({text:t, by:[]}));
      if (opts.length === 1) return go(2,'tell',{ opts, q:opts[0].text, tally:null });
      return go(2,'vote',{ opts: opts.slice(0,8) });
    }
    case '2:vote': {
      const tally = {}; c.opts.forEach((_,i)=>tally[i]=0);
      for (const [id,v] of Object.entries(resp())){ if (id!==c.seat && Number.isInteger(v) && v>=0 && v<c.opts.length) tally[v]++; }
      const max = Math.max(...Object.values(tally));
      const tops = Object.keys(tally).filter(i => tally[i]===max);
      const w = +tops[Math.floor(Math.random()*tops.length)];
      c.opts[w].by.forEach(id => addPts(id,100));
      addPts(c.seat, 100);
      return go(2,'tell',{ q:c.opts[w].text, tally, win:w });
    }
    case '2:pick': return; // needs a selection
    case '2:tell': return (G.r2.si + 1 < G.r2.seats.length) ? seatStart(G.r2.si + 1) : go(2,'scores');
    case '2:scores': return r3Setup();
    case '3:intro': return G.r3.items.length ? itemStart(0) : finish();
    case '3:vote': {
      const it = c.item; let result;
      if (it.type === 'ml'){
        const tally = {};
        if (G.mode==='room'){ for (const v of Object.values(resp())) if (G.players.some(p=>p.id===v)) tally[v] = (tally[v]||0)+1; }
        else Object.assign(tally, c.tally);
        result = Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([id,n]) => ({name:pname(id), n}));
        G.preds.push({ q:'Most likely to ' + it.t.charAt(0).toLowerCase() + it.t.slice(1), a: result.length ? result.map(r=>`${r.name} (${r.n})`).join(', ') : 'No votes' });
      } else {
        if (G.mode==='room') result = Object.entries(resp()).filter(([,v])=>typeof v==='string'&&v.trim()).map(([id,v]) => ({name:pname(id), text:v.trim().slice(0,160)}));
        else result = c.notes.trim() ? [{name:'The table', text:c.notes.trim()}] : [];
        G.preds.push({ q:it.t, a: result.length ? result.map(r=>`${r.name}: ${r.text}`).join(' | ') : 'No answers' });
      }
      return go(3,'reveal',{ result });
    }
    case '3:reveal': return (G.r3.ii + 1 < G.r3.items.length) ? itemStart(G.r3.ii + 1) : finish();
  }
}
function finish(){
  const all = store.get('mvtg-predictions', {});
  all[new Date().getFullYear()] = { savedAt: new Date().toISOString(), preds: G.preds, scores: G.players.map(p=>[p.name,p.score]) };
  store.set('mvtg-predictions', all);
  go(4,'end');
}

/* ---------------- PLAYER (PHONE) ---------------- */
let P = { peer:null, conn:null, code:'', name:'', me:null, lastK:null, s:null, mine:{}, sent:{}, sugg:{}, pres:{} };
let PID = null;
function myPid(){ if (PID) return PID; let id = store.get('mvtg-pid', null); if (!id){ id = 'u' + Math.random().toString(36).slice(2,10); store.set('mvtg-pid', id); } return PID = id; }
function sendPres(patch){ Object.assign(P.pres, patch); try { if (P.conn && P.conn.open) P.conn.send({ t:'pres', p:P.pres }); } catch(e){} }
function renderJoin(err){
  view = 'join'; document.body.classList.add('phone');
  app.innerHTML = `<div class="emoji">📱🍝</div><h1 style="font-size:40px">Join the table</h1><p class="sub">Mergenthaler-Vashio Thanksgiving</p>
    <label class="note">Game code (on the TV)</label><input type="text" id="jCode" maxlength="4" autocomplete="off" style="text-transform:uppercase;text-align:center;font-size:32px;letter-spacing:.2em">
    <label class="note" style="display:block;margin-top:12px">Your name</label><input type="text" id="jName" maxlength="20" value="${esc(store.get('mvtg-name',''))}" placeholder="e.g., Nonna">
    ${err?`<p class="err">${esc(err)}</p>`:''}
    <button class="btn block" id="jGo" style="margin-top:18px">Join ▶</button>
    <button class="btn ghost block small" id="jBack">Back</button>`;
  document.getElementById('jBack').onclick = renderHome;
  document.getElementById('jGo').onclick = doJoin;

async function doJoin(){
  const code = document.getElementById('jCode').value.trim().toUpperCase().replace(/[^A-Z]/g,'');
  const name = document.getElementById('jName').value.trim().slice(0,20);
  if (code.length !== 4) return renderJoin('Enter the 4-letter code from the TV.');
  if (!name) return renderJoin('Add your name so the table knows who you are.');
  store.set('mvtg-name', name);
  P.code = code; P.name = name;
  connectPlayer();
}
async function connectPlayer(){
  app.innerHTML = `<p class="mid">Pulling up a chair…</p>`;
  view = 'player'; P.me = myPid();
  try { if (P.peer) P.peer.destroy(); } catch(e){}
  let gotState = false;
  try { P.peer = await openPeer(null); }
  catch(e){ return renderJoin('Could not reach the internet. Check your Wi-Fi and try again.'); }
  P.peer.on('error', e => {
    if (e && e.type === 'peer-unavailable') lost(`Can't find a game with code ${P.code}. Check the TV.`);
  });
  const conn = P.peer.connect('mvtg-' + P.code.toLowerCase(), { reliable:true });
  P.conn = conn;
  conn.on('open', () => {
    P.pres = {};
    sendPres({ role:'p', pid:P.me, name:P.name, r: P.lastK && P.sent[P.lastK] !== undefined ? { k:P.lastK, v:P.sent[P.lastK] } : null });
  });
  conn.on('data', d => { if (d && d.t === 's' && d.s){ gotState = true; playerState(d.s); } });
  conn.on('close', () => { if (P.conn === conn) lost('Lost the connection to the TV.'); });
  setTimeout(() => { if (P.conn === conn && !gotState) lost(`Can't find a game with code ${P.code}. Check the TV.`); }, 10000);
}
function lost(msg){
  if (view !== 'player') return;
  P.conn = null;
  app.innerHTML = `<div class="emoji">📡</div><p class="mid">${esc(msg)}</p><p class="note">Your answers and points are safe.</p>
    <button class="btn block" id="rc">Reconnect</button><button class="btn ghost block small" id="rj">Change code or name</button>`;
  document.getElementById('rc').onclick = connectPlayer;
  document.getElementById('rj').onclick = () => { try{P.peer && P.peer.destroy()}catch(e){} renderJoin(); };
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && view === 'player' && (!P.conn || !P.conn.open) && P.code) connectPlayer();
});
function respond(v){ P.sent[P.lastK] = v; sendPres({ r:{ k:P.lastK, v } }); renderPlayer(P.s, true); }
function playerState(s){
  if (s.k !== P.lastK || !P.s){ P.lastK = s.k; P.s = s; renderPlayer(s, true); }
}
function waitScreen(title, sub){ return `<div class="emoji">📺</div><p class="mid">${title}</p><p class="note">${sub||'Eyes on the TV.'}</p>`; }
function renderPlayer(s, force){
  if (!s) return;
  const sent = P.sent[s.k];
  const others = (s.pl||[]).filter(([id]) => id !== P.me);
  const head = `<div class="center" style="margin-bottom:6px"><span class="tag">${esc(P.name)}</span></div>`;
  let h = '';
  const k = s.rd + ':' + s.ph;
  if (s.rd === 0) h = waitScreen("You're in! 🎉", 'Hang tight while everyone joins.');
  else if (s.ph === 'intro') h = `<div class="center"><span class="tag">${ROUNDS[s.rd][0]}</span></div><h1 style="font-size:40px;margin-top:10px">${ROUNDS[s.rd][1]}</h1><p class="sub">${ROUNDS[s.rd][2]}</p><p class="note">Eyes on the TV.</p>`;
  else if (s.ph === 'scores' || s.rd === 4) h = waitScreen(cheer(), 'Check the scoreboard on the TV.');
  else if (k === '1:ans'){
    if (sent !== undefined) h = waitScreen('Got it! 🤫', 'Don’t look at anyone.');
    else h = `<p class="mid">${esc(s.q)}</p><input type="text" id="a" maxlength="140" placeholder="Keep it short" autocomplete="off"><button class="btn block" id="send" style="margin-top:12px">Send</button>`;
  }
  else if (k === '1:guess'){
    const mine = P.mine[s.q] && P.mine[s.q].toLowerCase() === String(s.a).toLowerCase();
    if (mine) h = `<p class="mid">“${esc(s.a)}”</p><p class="big" style="font-size:30px">That one's yours 😏</p><p class="note">Poker face.</p>`;
    else if (sent !== undefined) h = waitScreen('Vote locked in', 'You picked ' + esc((s.pl.find(p=>p[0]===sent)||[,'someone'])[1]) + '.');
    else h = `<p class="mid">“${esc(s.a)}”</p><p class="note">Who said it?</p><div class="opts">${others.map(([id,n])=>`<button class="opt" data-v="${esc(id)}">${esc(n)}</button>`).join('')}</div>`;
  }
  else if (k === '1:reveal'){
    const au = (s.pl.find(p=>p[0]===s.au)||[,'Someone'])[1];
    const voted = P.sent[Object.keys(P.sent).find(x => x === s.k)] ;
    h = `<p class="note">It was</p><h1 style="font-size:44px">${esc(au)}</h1><p class="note">Eyes on the TV for the story.</p>`;
  }
  else if (s.rd === 2){
    const seatName = (s.pl.find(p=>p[0]===s.seat)||[,'Someone'])[1];
    if (s.seat === P.me) h = `<div class="emoji">🔥</div><p class="mid">You're in the hot seat!</p><p class="note">Sit back. The table is picking your question.</p>`;
    else if (k === '2:ask'){
      if (sent !== undefined) h = waitScreen('Question sent', 'Waiting on the rest of the table.');
      else {
        if (!P.sugg[s.k]) P.sugg[s.k] = pick(C.hot.filter(x => s.sp || !x[1]).map(x=>x[0]), 4);
        h = `<p class="mid">Pick a question for <b>${esc(seatName)}</b></p><div class="opts">${P.sugg[s.k].map(q=>`<button class="opt" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
             <p class="note">…or write your own</p><textarea id="own" maxlength="160" placeholder="Ask ${esc(seatName)} anything (keep it kind)"></textarea><button class="btn block" id="sendOwn">Send my question</button>`;
      }
    }
    else if (k === '2:vote'){
      if (sent !== undefined) h = waitScreen('Vote in', 'Let’s see which one wins.');
      else h = `<p class="mid">Which should <b>${esc(seatName)}</b> answer?</p><div class="opts">${(s.o||[]).map((q,i)=>`<button class="opt" data-i="${i}">${esc(q)}</button>`).join('')}</div>`;
    }
    else if (k === '2:tell') h = waitScreen('Story time 🍷', esc(seatName) + ' is answering. Phones down, ears up.');
  }
  else if (s.rd === 3){
    const it = s.it || {};
    if (s.ph === 'reveal') h = waitScreen('The results are in', 'Saved for next year.');
    else if (sent !== undefined) h = waitScreen('Locked in 🔮', 'We’ll see who called it in 2027.');
    else if (it.type === 'ml') h = `<p class="note">Who's most likely to…</p><p class="mid">${esc(it.t)}?</p><div class="opts">${(s.pl||[]).map(([id,n])=>`<button class="opt" data-v="${esc(id)}">${esc(n)}${id===P.me?' (me!)':''}</button>`).join('')}</div>`;
    else h = `<p class="mid">${esc(it.t)}</p><textarea id="pr" maxlength="160" placeholder="Your prediction"></textarea><button class="btn block" id="sendPr">Lock it in</button>`;
  }
  if (!h) h = waitScreen('Watch the TV');
  app.innerHTML = head + h;
  const $ = id => document.getElementById(id);
  if ($('send')){ const go = () => { const v=$('a').value.trim(); if(!v) return; P.mine[s.q]=v.slice(0,140); respond(v.slice(0,140)); }; $('send').onclick = go; $('a').onkeydown = e => { if(e.key==='Enter') go(); }; }
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => respond(b.dataset.v));
  app.querySelectorAll('[data-q]').forEach(b => b.onclick = () => respond(b.dataset.q));
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => respond(+b.dataset.i));
  if ($('sendOwn')) $('sendOwn').onclick = () => { const v = $('own').value.trim(); if (v) respond(v.slice(0,160)); };
  if ($('sendPr')) $('sendPr').onclick = () => { const v = $('pr').value.trim(); if (v) respond(v.slice(0,160)); };
}

renderHome();
</script>
</body>
</html>
